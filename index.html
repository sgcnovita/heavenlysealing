
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Revelation Fill-in-the-Blank Quiz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 8px;

        .header p {
            margin: 0;

        .settings {

        .settings-grid {

        .field {

<body>

<div class="container">

    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">

        <div class="settings-grid">

            <div class="field">

                    <option value="10">10%</option>
                    <option value="20">20%</option>
                    <option value="30" selected>30%</option>

                    <option value="50">50%</option>
                    <option value="60">60%</option>
                    <option value="70">70%</option>

            <div class="field">
                <label for="fromVerse">

            class="start-btn"
            onclick="startQuiz()"

    <!-- =========================
         QUIZ
    ========================== -->

    <div
        id="quizCard"
        class="quiz-card"
    >

        <div class="quiz-title">

            <h2 id="quizHeading">
                Revelation 4
            </h2>

            <div
                id="scoreDisplay"
                class="score-display"

                Not checked
            </div>

        </div>


        <div id="quizContent"></div>


        <div class="button-area">

            <button
                id="checkButton"
                class="check-btn"
                onclick="checkAnswers()"
            >
                ✓ Check Answers
            </button>


            <button
                id="retestButton"
                class="retest-btn hidden"
                onclick="retestWrongAnswers()"
            >
                🔄 Retest Wrong Answers
            </button>

                class="restart-btn hidden"

            >

        <div
            id="results"
            class="results"
        >
            <h3>Quiz Result</h3>

            <div
                id="resultScore"
                class="result-score"
            >
            </div>

            <p id="resultDetails"></p>
        </div>

    </div>

</div>


<script>

/*
===========================================================
    IMPORTANT
===========================================================

    PASTE YOUR LEGALLY OBTAINED NIV 2011 TEXT BELOW.

    Format:

    1: "Your verse 1 text here.",
    2: "Your verse 2 text here.",
    3: "Your verse 3 text here.",

    Do this for Revelation 4, 5 and 6.

===========================================================
*/


const bibleData = {

    4: {

        1: "PASTE NIV 2011 REVELATION 4:1 HERE",

        2: "PASTE NIV 2011 REVELATION 4:2 HERE",

        3: "PASTE NIV 2011 REVELATION 4:3 HERE",

        4: "PASTE NIV 2011 REVELATION 4:4 HERE",

        5: "PASTE NIV 2011 REVELATION 4:5 HERE",

        6: "PASTE NIV 2011 REVELATION 4:6 HERE",

        7: "PASTE NIV 2011 REVELATION 4:7 HERE",

        8: "PASTE NIV 2011 REVELATION 4:8 HERE",

        9: "PASTE NIV 2011 REVELATION 4:9 HERE",

        10: "PASTE NIV 2011 REVELATION 4:10 HERE",

        11: "PASTE NIV 2011 REVELATION 4:11 HERE"

    },


    5: {

        1: "PASTE NIV 2011 REVELATION 5:1 HERE",

        2: "PASTE NIV 2011 REVELATION 5:2 HERE",

        3: "PASTE NIV 2011 REVELATION 5:3 HERE",

        4: "PASTE NIV 2011 REVELATION 5:4 HERE",

        5: "PASTE NIV 2011 REVELATION 5:5 HERE",

        6: "PASTE NIV 2011 REVELATION 5:6 HERE",

        7: "PASTE NIV 2011 REVELATION 5:7 HERE",

        8: "PASTE NIV 2011 REVELATION 5:8 HERE",

        9: "PASTE NIV 2011 REVELATION 5:9 HERE",

        10: "PASTE NIV 2011 REVELATION 5:10 HERE",

        11: "PASTE NIV 2011 REVELATION 5:11 HERE",

        12: "PASTE NIV 2011 REVELATION 5:12 HERE",

        13: "PASTE NIV 2011 REVELATION 5:13 HERE",

        14: "PASTE NIV 2011 REVELATION 5:14 HERE"

    },


    6: {

        1: "I watched as the Lamb opened the first of the seven seals. Then I heard one of the four living creatures say in a voice like thunder, “Come!”",

        2: "I watched as the Lamb opened the first of the seven seals. Then I heard one of the four living creatures say in a voice like thunder, “Come!”",

        3: "When the Lamb opened the second seal, I heard the second living creature say, “Come!”",

        4: "Then another horse came out, a fiery red one. Its rider was given power to take peace from the earth and to make people kill each other. To him was given a large sword.",

        5: "When the Lamb opened the third seal, I heard the third living creature say, “Come!” I looked, and there before me was a black horse! Its rider was holding a pair of scales in his hand.",

        6: "Then I heard what sounded like a voice among the four living creatures, saying, “Two pounds of wheat for a day’s wages, and six pounds of barley for a day’s wages, and do not damage the oil and the wine!”",

        7: "When the Lamb opened the fourth seal, I heard the voice of the fourth living creature say, “Come!”",

        8: "PASTE NIV 2011 REVELATION 6:8 HERE",

        9: "PASTE NIV 2011 REVELATION 6:9 HERE",

        10: "PASTE NIV 2011 REVELATION 6:10 HERE",

        11: "PASTE NIV 2011 REVELATION 6:11 HERE",

        12: "PASTE NIV 2011 REVELATION 6:12 HERE",

        13: "PASTE NIV 2011 REVELATION 6:13 HERE",

        14: "PASTE NIV 2011 REVELATION 6:14 HERE",

        15: "PASTE NIV 2011 REVELATION 6:15 HERE",

        16: "PASTE NIV 2011 REVELATION 6:16 HERE",

        17: "PASTE NIV 2011 REVELATION 6:17 HERE"

    }

};


/*
===========================================================
    GLOBAL VARIABLES
===========================================================
*/

let currentChapter = null;

let currentFromVerse = null;

let currentToVerse = null;

let currentPercentage = null;

let currentQuiz = [];

let quizChecked = false;


/*
===========================================================
    INITIALIZE VERSE LIMITS
===========================================================
*/

document
    .getElementById("chapterSelect")
    .addEventListener("change", updateVerseLimits);


function updateVerseLimits() {

    const chapter =
        Number(
            document.getElementById("chapterSelect").value
        );

    const verses =
        Object.keys(bibleData[chapter])
            .map(Number);

    const maxVerse =
        Math.max(...verses);


    const fromInput =
        document.getElementById("fromVerse");

    const toInput =
        document.getElementById("toVerse");


    fromInput.max = maxVerse;

    toInput.max = maxVerse;


    fromInput.value = 1;

    toInput.value = maxVerse;
}


/*
===========================================================
    START QUIZ
===========================================================
*/

function startQuiz() {

    currentChapter =
        Number(
            document.getElementById("chapterSelect").value
        );

    currentFromVerse =
        Number(
            document.getElementById("fromVerse").value
        );

    currentToVerse =
        Number(
            document.getElementById("toVerse").value
        );

    currentPercentage =
        Number(
            document.getElementById("percentageSelect").value
        );


    const chapterData =
        bibleData[currentChapter];


    const availableVerses =
        Object.keys(chapterData)
            .map(Number)
            .sort((a, b) => a - b);


    const maxVerse =
        Math.max(...availableVerses);


    /*
        Validate verse range.
    */

    if (
        currentFromVerse < 1 ||
        currentToVerse > maxVerse ||
        currentFromVerse > currentToVerse
    ) {

        alert(
            `Please enter a valid verse range from 1 to ${maxVerse}.`
        );

        return;
    }


    /*
        Create quiz.
    */

    currentQuiz =
        createQuiz(
            currentChapter,
            currentFromVerse,
            currentToVerse,
            currentPercentage
        );


    quizChecked = false;


    renderQuiz();


    /*
        Show quiz.
    */

    document
        .getElementById("quizCard")
        .style.display = "block";


    document
        .getElementById("quizCard")
        .scrollIntoView({
            behavior: "smooth"
        });
}


/*
===========================================================
    CREATE QUIZ
===========================================================
*/

function createQuiz(
    chapter,
    fromVerse,
    toVerse,
    percentage
) {

    const quiz = [];

    /*
        ---------------------------------------------------
        1. Collect all available words
        ---------------------------------------------------
    */

    let totalWords = 0;

    for (
        let verse = fromVerse;
        verse <= toVerse;
        verse++
    ) {

        const text = bibleData[chapter][verse];

        if (
            !text ||
            text.startsWith("PASTE NIV")
        ) {
            continue;
        }

        const words = tokenizeText(text);

        totalWords += words.length;
    }


    /*
        ---------------------------------------------------
        2. Calculate how many words should be hidden
        ---------------------------------------------------
    */

    let targetBlankWords =
        Math.round(
            totalWords * percentage / 100
        );


    if (
        totalWords >= 2 &&
        targetBlankWords < 2
    ) {
        targetBlankWords = 2;
    }


    /*
        ---------------------------------------------------
        3. Create possible multi-word blank groups
        ---------------------------------------------------

        Every blank must contain AT LEAST 2 words.

        Example:

        "I saw a great throne in heaven"

        Possible blanks:

        "I saw"
        "saw a"
        "a great"
        "great throne"
        "throne in"
        "in heaven"

        Longer groups are also possible.
    */

    const allWords = [];

    for (
        let verse = fromVerse;
        verse <= toVerse;
        verse++
    ) {

        const text = bibleData[chapter][verse];

        if (
            !text ||
            text.startsWith("PASTE NIV")
        ) {
            continue;
        }

        const words = tokenizeText(text);

        words.forEach(
            (word, wordIndex) => {

                allWords.push({
                    verse: verse,
                    wordIndex: wordIndex,
                    word: word
                });

            }
        );
    }


    /*
        ---------------------------------------------------
        4. Create random blank groups
        ---------------------------------------------------

        Each group contains 2 or more words.

        We try to get close to the requested
        percentage while making sure that every
        blank contains multiple words.
    */

    const blankGroups = [];

    let remainingWords = targetBlankWords;


    /*
        Shuffle starting positions so the blank
        locations are different every time.
    */

    const possibleStarts = [];

    for (
        let i = 0;
        i < allWords.length - 1;
        i++
    ) {
        possibleStarts.push(i);
    }

    shuffleArray(possibleStarts);


    /*
        Track which words have already been
        used in a blank.
    */

    const usedWords = new Set();


    for (
        let s = 0;
        s < possibleStarts.length;
        s++
    ) {

        if (remainingWords < 2) {
            break;
        }


        const startIndex =
            possibleStarts[s];

        const startWord =
            allWords[startIndex];


        const startKey =
            `${startWord.verse}-${startWord.wordIndex}`;


        /*
            Do not use a word that is already
            part of another blank.
        */

        if (
            usedWords.has(startKey)
        ) {
            continue;
        }


        /*
            Find consecutive words in the
            SAME VERSE.

            This prevents a blank from crossing
            from one verse into another.
        */

        const possibleLengths = [];


        for (
            let length = 2;
            length <= Math.min(6, remainingWords);
            length++
        ) {

            let valid = true;


            for (
                let i = 0;
                i < length;
                i++
            ) {

                const current =
                    allWords[startIndex + i];


                if (
                    !current ||
                    current.verse !== startWord.verse ||
                    usedWords.has(
                        `${current.verse}-${current.wordIndex}`
                    )
                ) {

                    valid = false;
                    break;
                }

            }


            if (valid) {
                possibleLengths.push(length);
            }
        }


        /*
            If we cannot make a multi-word blank
            here, move to another location.
        */

        if (
            possibleLengths.length === 0
        ) {
            continue;
        }


        /*
            Randomly choose the blank length.

            Prefer 2–4 words, with occasional
            longer blanks.
        */

        const length =
            possibleLengths[
                Math.floor(
                    Math.random() *
                    possibleLengths.length
                )
            ];


        const group = [];


        for (
            let i = 0;
            i < length;
            i++
        ) {

            const current =
                allWords[startIndex + i];

            group.push({
                verse: current.verse,
                wordIndex: current.wordIndex
            });


            usedWords.add(
                `${current.verse}-${current.wordIndex}`
            );

        }


        blankGroups.push(group);

        remainingWords -= length;
    }


    /*
        ---------------------------------------------------
        5. If only 1 word remains, do NOT create a
           one-word blank.

           Instead, leave it visible.

           This guarantees that EVERY blank has
           at least 2 words.
        ---------------------------------------------------
    */


    /*
        ---------------------------------------------------
        6. Convert blank groups into a lookup Set
        ---------------------------------------------------
    */

    const blankLookup = new Set();

    blankGroups.forEach(
        group => {

            group.forEach(
                position => {

                    blankLookup.add(
                        `${position.verse}-${position.wordIndex}`
                    );

                }
            );

        }
    );


    /*
        ---------------------------------------------------
        7. Build quiz data
        ---------------------------------------------------
    */

    for (
        let verse = fromVerse;
        verse <= toVerse;
        verse++
    ) {

        const text = bibleData[chapter][verse];

        if (
            !text ||
            text.startsWith("PASTE NIV")
        ) {
            continue;
        }


        const words = tokenizeText(text);


        const verseQuiz = {

            verse: verse,

            words: words.map(
                (word, index) => ({

                    original: word,

                    blank:
                        blankLookup.has(
                            `${verse}-${index}`
                        ),

                    answer: word,

                    userAnswer: "",

                    correct: null

                })
            )

        };


        quiz.push(verseQuiz);
    }


    return quiz;
}

/*
===========================================================
    TOKENIZE TEXT
===========================================================

    We keep punctuation attached to words visually.

    Example:

    "throne,"
    
    remains:

    "throne,"

    However, punctuation will be ignored during marking.
===========================================================
*/

function tokenizeText(text) {

    return text
        .trim()
        .split(/\s+/);
}


/*
===========================================================
    RENDER QUIZ
===========================================================
*/

function renderQuiz() {

    const content =
        document.getElementById("quizContent");

    content.innerHTML = "";


    document
        .getElementById("quizHeading")
        .textContent =
            `Revelation ${currentChapter}`;


    document
        .getElementById("scoreDisplay")
        .textContent =
            `${currentFromVerse}:${currentToVerse} • ${currentPercentage}% blanks`;


    currentQuiz.forEach(
        verseData => {

            const verseDiv =
                document.createElement("div");

            verseDiv.className =
                "verse";


            const verseNumber =
                document.createElement("span");

            verseNumber.className =
                "verse-number";

            verseNumber.textContent =
                verseData.verse + ".";


            verseDiv.appendChild(
                verseNumber
            );


            let i = 0;


            while (
                i < verseData.words.length
            ) {

                const wordData =
                    verseData.words[i];


                /*
                    ------------------------------------------------
                    If this word is a blank, collect ALL consecutive
                    blank words and make ONE input.
                    ------------------------------------------------
                */

                if (wordData.blank) {

                    const blankWords = [];

                    let j = i;


                    while (
                        j < verseData.words.length &&
                        verseData.words[j].blank
                    ) {

                        blankWords.push(
                            verseData.words[j]
                        );

                        j++;

                    }


                    /*
                        The correct answer is the entire
                        multi-word phrase.
                    */

                    const correctPhrase =
                        blankWords
                            .map(
                                word =>
                                    word.original
                            )
                            .join(" ");


                    /*
                        Create one input for the entire phrase.
                    */

                    const input =
                        document.createElement("input");


                    input.type = "text";

                    input.className =
                        "blank-input";


                    input.dataset.verse =
                        verseData.verse;


                    input.dataset.wordIndex =
                        i;


                    input.dataset.blankLength =
                        blankWords.length;


                    input.dataset.answer =
                        correctPhrase;


                    /*
                        Make the input considerably wider
                        because it contains multiple words.
                    */

                    const cleanPhrase =
                        removePunctuation(
                            correctPhrase
                        );


                    const width =
                        Math.max(
                            180,
                            Math.min(
                                500,
                                cleanPhrase.length * 10 + 50
                            )
                        );


                    input.style.width =
                        width + "px";


                    input.autocomplete =
                        "off";


                    input.spellcheck =
                        false;


                    /*
                        Save the complete phrase.
                    */

                    input.addEventListener(
                        "input",
                        function () {

                            const answer =
                                this.value;


                            /*
                                Save answer to the first
                                word of this blank.
                            */

                            verseData.words[i].userAnswer =
                                answer;


                            /*
                                Clear previous result
                                if the quiz hasn't been
                                checked yet.
                            */

                            if (!quizChecked) {

                                this.classList.remove(
                                    "correct",
                                    "wrong",
                                    "unanswered"
                                );

                            }

                        }
                    );


                    verseDiv.appendChild(
                        input
                    );


                    /*
                        Move past the entire blank group.
                    */

                    i = j;

                } else {

                    /*
                        Normal visible word.
                    */

                    const textNode =
                        document.createTextNode(
                            wordData.original + " "
                        );


                    verseDiv.appendChild(
                        textNode
                    );


                    i++;

                }

            }


            content.appendChild(
                verseDiv
            );

        }
    );


    /*
        Reset buttons/results.
    */

    document
        .getElementById("checkButton")
        .classList.remove("hidden");


    document
        .getElementById("retestButton")
        .classList.add("hidden");


    document
        .getElementById("restartButton")
        .classList.add("hidden");


    document
        .getElementById("results")
        .style.display = "none";
}

/*
===========================================================
    CHECK ANSWERS
===========================================================
*/

function checkAnswers() {

    let total = 0;

    let correct = 0;

    let wrong = 0;


    /*
        Find every multi-word blank.
    */

    currentQuiz.forEach(
        verseData => {

            let i = 0;


            while (
                i < verseData.words.length
            ) {

                const wordData =
                    verseData.words[i];


                if (!wordData.blank) {

                    i++;
                    continue;

                }


                /*
                    Collect the complete blank.
                */

                const blankWords = [];

                let j = i;


                while (
                    j < verseData.words.length &&
                    verseData.words[j].blank
                ) {

                    blankWords.push(
                        verseData.words[j]
                    );

                    j++;

                }


                /*
                    One multi-word phrase = one question.
                */

                total++;


                const input =
                    document.querySelector(
                        `.blank-input[data-verse="${verseData.verse}"][data-word-index="${i}"]`
                    );


                if (!input) {

                    i = j;
                    continue;

                }


                const userAnswer =
                    input.value.trim();


                const correctAnswer =
                    blankWords
                        .map(
                            word =>
                                word.original
                        )
                        .join(" ");


                /*
                    Save the user's answer to
                    the first word of the blank.
                */

                verseData.words[i].userAnswer =
                    userAnswer;


                /*
                    Compare the ENTIRE phrase.
                */

                const isCorrect =
                    phraseIsEquivalent(
                        userAnswer,
                        correctAnswer
                    );


                /*
                    Save result to every word
                    belonging to this blank.
                */

                blankWords.forEach(
                    wordData => {

                        wordData.correct =
                            isCorrect;

                        wordData.userAnswer =
                            userAnswer;

                    }
                );


                input.classList.remove(
                    "correct",
                    "wrong",
                    "unanswered"
                );


                input.classList.add(
                    isCorrect
                        ? "correct"
                        : "wrong"
                );


                input.classList.add(
                    "checked"
                );


                input.readOnly = true;


                if (isCorrect) {

                    correct++;

                } else {

                    wrong++;

                }


                /*
                    Move to the next group.
                */

                i = j;

            }

        }
    );


    quizChecked = true;


    /*
        Calculate score based on BLANK PHRASES,
        not individual words.
    */

    const score =
        total === 0
            ? 0
            : Math.round(
                (correct / total) * 100
            );


    document
        .getElementById("scoreDisplay")
        .textContent =
            `Score: ${score}%`;


    /*
        Display result.
    */

    const results =
        document.getElementById("results");


    results.style.display =
        "block";


    document
        .getElementById("resultScore")
        .textContent =
            `${score}%`;


    document
        .getElementById("resultScore")
        .className =
            "result-score " +
            (
                score >= 80
                    ? "success"
                    : "failure"
            );


    document
        .getElementById("resultDetails")
        .textContent =
            `Correct: ${correct} • Wrong: ${wrong} • Total blanks: ${total}`;


    /*
        Retest button.
    */

    if (wrong > 0) {

        document
            .getElementById("retestButton")
            .classList.remove("hidden");

    } else {

        document
            .getElementById("retestButton")
            .classList.add("hidden");

    }


    /*
        New quiz button.
    */

    document
        .getElementById("restartButton")
        .classList.remove("hidden");


    /*
        Hide Check button.
    */

    document
        .getElementById("checkButton")
        .classList.add("hidden");


    results.scrollIntoView({
        behavior: "smooth"
    });
}

/*
===========================================================
    WORD COMPARISON
===========================================================

    Rules:

    1. Word-by-word strict checking.
    2. Punctuation ignored.
    3. Capitalization ignored.
    4. Apostrophe variations accepted.
    5. God's = Gods = God s
    6. Similar possessive forms are normalized.

===========================================================
*/

function normalizeWord(word) {

    if (!word) {
        return "";
    }


    let normalized =
        word
            .toLowerCase()
            .trim();


    /*
        Remove punctuation.

        Examples:

        throne,
        throne.
        throne;
        throne:

        become:

        throne
    */

    normalized =
        normalized.replace(
            /[.,!?;:"“”‘’()[\]{}—–\-]/g,
            ""
        );


    /*
        Remove apostrophes.

        God's
        God’s
        Gods

        all become:

        gods
    */

    normalized =
        normalized.replace(
            /['’`]/g,
            ""
        );


    /*
        Remove whitespace.

        God s
        becomes:

        gods
    */

    normalized =
        normalized.replace(
            /\s+/g,
            ""
        );


    return normalized;
}


function phraseIsEquivalent(
    userAnswer,
    correctAnswer
) {

    /*
        Normalize the complete phrase.

        This:
        - ignores capitalization
        - ignores punctuation
        - accepts straight/curly apostrophes
        - removes extra spaces
    */

    if (!userAnswer || !correctAnswer) {
        return false;
    }


    const userWords =
        userAnswer
            .trim()
            .split(/\s+/)
            .map(word => normalizeWord(word))
            .filter(word => word !== "");


    const correctWords =
        correctAnswer
            .trim()
            .split(/\s+/)
            .map(word => normalizeWord(word))
            .filter(word => word !== "");


    /*
        The number of words must match.

        Therefore:

        "throne in heaven"

        is NOT accepted as:

        "throne heaven"
    */

    if (
        userWords.length !==
        correctWords.length
    ) {

        return false;

    }


    /*
        Compare each word.
    */

    for (
        let i = 0;
        i < correctWords.length;
        i++
    ) {

        if (
            userWords[i] !==
            correctWords[i]
        ) {

            return false;

        }

    }


    return true;
}

/*
===========================================================
    REMOVE PUNCTUATION
===========================================================
*/

function removePunctuation(word) {

    return word
        .replace(
            /[.,!?;:"“”‘’()[\]{}—–\-]/g,
            ""
        );
}


/*
===========================================================
    RETEST WRONG ANSWERS
===========================================================

    Important:

    Only words that were previously wrong
    become blanks.

    Correct words are shown normally.

    The wrong words are randomized into a
    new test arrangement if there are multiple
    wrong words.

===========================================================
*/

function retestWrongAnswers() {

    const wrongGroups = [];


    /*
        Find every previously wrong blank phrase.
    */

    currentQuiz.forEach(
        verseData => {

            let i = 0;


            while (
                i < verseData.words.length
            ) {

                const wordData =
                    verseData.words[i];


                if (
                    !wordData.blank
                ) {

                    i++;
                    continue;

                }


                const blankWords = [];

                let j = i;


                while (
                    j < verseData.words.length &&
                    verseData.words[j].blank
                ) {

                    blankWords.push(
                        verseData.words[j]
                    );

                    j++;

                }


                /*
                    If the first word is marked wrong,
                    the entire phrase is wrong.
                */

                if (
                    wordData.correct === false
                ) {

                    wrongGroups.push({

                        verse:
                            verseData.verse,

                        startIndex:
                            i,

                        length:
                            j - i

                    });

                }


                i = j;

            }

        }
    );


    if (
        wrongGroups.length === 0
    ) {

        alert(
            "There are no wrong answers to retest."
        );

        return;
    }


    /*
        Clear all previous blanks.
    */

    currentQuiz.forEach(
        verseData => {

            verseData.words.forEach(
                wordData => {

                    wordData.blank =
                        false;

                    wordData.userAnswer =
                        "";

                    wordData.correct =
                        null;

                }
            );

        }
    );


    /*
        Restore ONLY the wrong multi-word
        phrases as blanks.
    */

    wrongGroups.forEach(
        group => {

            const verse =
                currentQuiz.find(
                    v =>
                        v.verse === group.verse
                );


            if (!verse) {
                return;
            }


            for (
                let i = 0;
                i < group.length;
                i++
            ) {

                const word =
                    verse.words[
                        group.startIndex + i
                    ];


                if (word) {

                    word.blank =
                        true;

                    word.correct =
                        null;

                    word.userAnswer =
                        "";

                }

            }

        }
    );


    /*
        Render retest.
    */

    quizChecked = false;


    renderQuiz();


    document
        .getElementById("scoreDisplay")
        .textContent =
            `Retest • ${wrongGroups.length} blank${wrongGroups.length === 1 ? "" : "s"}`;


    document
        .getElementById("quizHeading")
        .textContent =
            `Revelation ${currentChapter} — Retest`;


    document
        .getElementById("quizCard")
        .scrollIntoView({
            behavior: "smooth"
        });

}
    
function shuffleArray(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];
    }


    return array;
}
