<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Revelation Fill-in-the-Blank Quiz</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f8ff;
            color: #1e293b;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 95%;
            max-width: 1100px;

            margin: 30px auto;
            padding: 25px;

            background: white;

            border-radius: 12px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.08);
        }


        /* =========================
           HEADER
        ========================= */

        header {
            text-align: center;

            margin-bottom: 25px;
        }

        header h1 {
            margin: 0 0 8px;

            font-size: 30px;

            color: #1e3a8a;
        }

        header p {
            margin: 0;

            color: #64748b;

            font-size: 15px;
        }


        /* =========================
           SETTINGS
        ========================= */

        .settings {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            padding: 20px;

            margin-bottom: 20px;

            background: #f8fafc;

            border:
                1px solid #e2e8f0;

            border-radius: 10px;
        }

        .setting-group {
            display: flex;

            flex-direction: column;

            gap: 6px;
        }

        .setting-group label {
            font-size: 14px;

            font-weight: bold;

            color: #334155;
        }

        select,
        input[type="number"] {
            width: 100%;

            padding: 10px 12px;

            font-size: 15px;

            border:
                1px solid #cbd5e1;

            border-radius: 7px;

            background: white;

            outline: none;
        }

        select:focus,
        input[type="number"]:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 2px
                rgba(37, 99, 235, 0.1);
        }


        /* =========================
           BUTTONS
        ========================= */

        .button-area {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 10px;

            margin: 20px 0;
        }

        button {
            border: none;

            border-radius: 7px;

            padding: 11px 20px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.15s,
                opacity 0.15s;
        }

        button:hover {
            transform: translateY(-1px);

            opacity: 0.92;
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;

            cursor: not-allowed;

            transform: none;
        }

        .start-btn {
            background: #2563eb;

            color: white;
        }

        .check-btn {
            background: #16a34a;

            color: white;
        }

        .restart-btn {
            background: #475569;

            color: white;
        }

        .retest-btn {
            background: #9333ea;

            color: white;
        }


        /* =========================
           INFORMATION BOX
        ========================= */

        .info-box {
            margin-bottom: 20px;

            padding: 14px 16px;

            background: #eff6ff;

            border-left:
                5px solid #2563eb;

            border-radius: 8px;

            line-height: 1.5;

            font-size: 14px;
        }

        .warning-box {
            margin-bottom: 20px;

            padding: 14px 16px;

            background: #fff7ed;

            border-left:
                5px solid #f97316;

            border-radius: 8px;

            line-height: 1.5;

            font-size: 14px;
        }


        /* =========================
           QUIZ AREA
        ========================= */

        #quizArea {
            margin-top: 20px;
        }

        .chapter-title {
            margin:
                20px 0;

            padding-bottom: 10px;

            border-bottom:
                2px solid #e2e8f0;

            color: #1e3a8a;

            font-size: 24px;
        }


        /* =========================
           VERSES
        ========================= */

        .verse {
            margin-bottom: 16px;

            font-size: 17px;

            line-height: 2;

            color: #1f2937;
        }

        .verse-number {
            display: inline-block;

            margin-right: 6px;

            font-weight: bold;

            color: #1e40af;

            vertical-align: top;
        }


        /* =========================
           BLANK INPUT
        ========================= */

        .blank-input {
            min-width: 180px;
        
            max-width: 100%;
        
            width: auto;
        
            min-height: 38px;
        
            padding: 5px 9px;
        
            margin: 0 3px;
        
            font-family: inherit;
        
            font-size: 16px;
        
            line-height: 1.5;
        
            border:
                2px solid #94a3b8;
        
            border-radius: 6px;
        
            outline: none;
        
            background: white;
        
            resize: none;
        
            overflow: hidden;
        
            vertical-align: middle;
        
            transition:
                border-color 0.15s,
                background 0.15s;
        }
        
        .blank-input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 2px
                rgba(37, 99, 235, 0.1);
        }

        .blank-input.correct {
            border-color: #16a34a;

            color: #166534;

            background: #f0fdf4;
        }

        .blank-input.wrong {
            border-color: #dc2626;

            color: #991b1b;

            background: #fef2f2;
        }

        .blank-input.unanswered {
            border-color: #dc2626;

            background: #fef2f2;
        }

        .blank-input.checked {
            cursor: default;
        }


        /* =========================
           CORRECT ANSWER DISPLAY
        ========================= */

        .correct-answer-display {
            display: inline-block;

            color: #065f46;

            background: #bbf7d0;

            border:
                2px solid #16a34a;

            border-radius: 6px;

            padding:
                4px 10px;

            margin-left: 8px;

            margin-right: 8px;

            font-size: 14px;

            font-weight: bold;

            line-height: 1.5;

            vertical-align: middle;
        }

        .correct-answer-display::before {
            content: "✓ Correct: ";

            color: #15803d;
        }


        /* =========================
           RESULT
        ========================= */

        #result {
            margin-top: 25px;

            padding: 20px;

            border-radius: 10px;

            background: #f8fafc;

            border:
                1px solid #e2e8f0;

            text-align: center;
        }

        #result h2 {
            margin-top: 0;

            color: #1e3a8a;
        }

        .score {
            font-size: 24px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .success {
            color: #15803d;
        }

        .failure {
            color: #dc2626;
        }


        /* =========================
           HIDDEN
        ========================= */

        .hidden {
            display: none !important;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .settings {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 550px) {

            .container {
                width: 100%;

                margin: 0;

                padding: 15px;

                border-radius: 0;

                box-shadow: none;
            }

            header h1 {
                font-size: 24px;
            }

            .settings {
                grid-template-columns: 1fr;

                padding: 15px;
            }

            .verse {
                font-size: 15px;

                line-height: 2.1;
            }

            .blank-input {
                min-width: 150px;

                max-width: 100%;

                font-size: 15px;
            }

            .correct-answer-display {
                margin-top: 5px;

                margin-bottom: 5px;

                font-size: 13px;
            }

            .button-area {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

        }

    </style>
</head>

        ========================= -->

        <!-- =========================
             BUTTONS
        ========================= -->

        <div class="button-area">

            <button

            </button>

            <button

            >
                Retest Wrong Answers
            </button>

            <button
                id="restartBtn"

                onclick="startQuiz()"
            >
                New Quiz

        <!-- =========================
             QUIZ
        ========================= -->

        <!-- =========================
             RESULT
        ========================= -->

        <div
            id="result"
            class="hidden"
        ></div>

    <script>

        /* =========================================================

                12: "In a loud voice they were saying:\n“Worthy is the Lamb, who was slain,\nto receive power and wealth and wisdom and strength\nand honor and glory and praise!”",
        
                13: "Then I heard every creature in heaven and on earth and under the earth and on the sea, and all that is in them, saying:\n“To him who sits on the throne and to the Lamb\nbe praise and honor and glory and power,\nfor ever and ever!”",
        
                14: "The four living creatures said, “Amen,” and the elders fell down and worshiped."

            6: {
        
                1: "I watched as the Lamb opened the first of the seven seals. Then I heard one of the four living creatures say in a voice like thunder, “Come!”",
        
                2: "I watched as the Lamb opened the first of the seven seals. Then I heard one of the four living creatures say in a voice like thunder, “Come!”",
        
                3: "When the Lamb opened the second seal, I heard the second living creature say, “Come!”",
        
                4: "Then another horse came out, a fiery red one. Its rider was given power to take peace from the earth and to make people kill each other. To him was given a large sword.",
        
                5: "When the Lamb opened the third seal, I heard the third living creature say, “Come!” I looked, and there before me was a black horse! Its rider was holding a pair of scales in his hand.",
        
                6: "Then I heard what sounded like a voice among the four living creatures, saying, “Two pounds of wheat for a day’s wages, and six pounds of barley for a day’s wages, and do not damage the oil and the wine!”",
        
                7: "When the Lamb opened the fourth seal, I heard the voice of the fourth living creature say, “Come!”",
        
                8: "PASTE NIV 2011 REVELATION :8 HERE",
        
                9: "PASTE NIV 2011 REVELATION :9 HERE",
        
                10: "PASTE NIV 2011 REVELATION :10 HERE",
        
                11: "PASTE NIV 2011 REVELATION :11 HERE",
        
                12: "PASTE NIV 2011 REVELATION :12 HERE",
        
                13: "PASTE NIV 2011 REVELATION :13 HERE",
        
                14: "PASTE NIV 2011 REVELATION :14 HERE",
        
                15: "PASTE NIV 2011 REVELATION :15 HERE",
        
                1: "PASTE NIV 2011 REVELATION :1 HERE",
        
                17: "PASTE NIV 2011 REVELATION :17 HERE"
        
            }
        
        };


        /* =========================================================
           GLOBAL VARIABLES
        ========================================================= */

        let currentChapter = null;

        let currentStartVerse = 1;

        let currentEndVerse = 1;

        let currentPercentage = 30;

        let quizChecked = false;


        /* =========================================================
           HELPER FUNCTIONS
        ========================================================= */

        function shuffle(array) {

            const result = [...array];

            for (
                let i = result.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() * (i + 1)
                    );

                [
                    result[i],
                    result[j]
                ] =
                [
                    result[j],
                    result[i]
                ];

            }

            return result;
        }


        function normalizeWord(word) {

            return word
                .toLowerCase()
                .trim()
                .replace(
                    /[^\p{L}\p{N}']/gu,
                    ""
                )
                .replace(
                    /\s+/g,
                    ""
                );

        }


        function phraseIsEquivalent(
            userAnswer,
            correctAnswer
        ) {

            const userWords =
                userAnswer
                    .trim()
                    .split(/\s+/)
                    .filter(Boolean);

            const correctWords =
                correctAnswer
                    .trim()
                    .split(/\s+/)
                    .filter(Boolean);


            if (
                userWords.length !==
                correctWords.length
            ) {

                return false;

            }


            for (
                let i = 0;
                i < correctWords.length;
                i++
            ) {

                if (
                    normalizeWord(
                        userWords[i]
                    ) !==
                    normalizeWord(
                        correctWords[i]
                    )
                ) {

                    return false;

                }

            }


            return true;

        }


        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }


        /* =========================================================
           GET VALID VERSES
        ========================================================= */

        function getSelectedVerses() {

            const data =
                bibleData[currentChapter];

            const verses = [];

            for (
                let verse =
                    currentStartVerse;

                verse <= currentEndVerse;

                verse++
            ) {

                if (
                    data &&
                    data[verse] &&
                    data[verse].trim() !== ""
                ) {

                    verses.push({
                        verse: verse,
                        text: data[verse]
                    });

                }

            }

            return verses;

        }


        /* =========================================================
           CREATE QUIZ
        ========================================================= */

        function createQuiz(verses) {
        
            /*
                ==========================================
                SPECIAL CASE: 100% BLANK
                ==========================================
        
                If 100% is selected, every word is blank.
        
                We still group the words into chunks of
                2–6 words so the input boxes don't become
                extremely large.
            */
        
            if (currentPercentage === 100) {
        
                verses.forEach(
                    verseData => {
        
                        const words =
                            verseData.text
                                .trim()
                                .split(/\s+/);
        
        
                        verseData.words =
                            words.map(
                                word => ({
        
                                    text: word,
        
                                    blank: true,
        
                                    userAnswer: "",
        
                                    correct: null
        
                                })
                            );
        
                    }
                );
        
        
                return verses;
            }
        
        
            /*
                ==========================================
                NORMAL MODE: 10–90%
                ==========================================
            */
        
            const allWords = [];
        
            let totalWords = 0;
        
        
            /*
                Split every verse into words.
            */
        
            verses.forEach(
                verseData => {
        
                    const words =
                        verseData.text
                            .trim()
                            .split(/\s+/);
        
        
                    verseData.words =
                        words.map(
                            word => ({
        
                                text: word,
        
                                blank: false,
        
                                userAnswer: "",
        
                                correct: null
        
                            })
                        );
        
        
                    totalWords +=
                        verseData.words.length;
        
        
                    verseData.words.forEach(
                        (word, index) => {
        
                            allWords.push({
        
                                verse:
                                    verseData.verse,
        
                                index: index
        
                            });
        
                        }
                    );
        
                }
            );
        
        
            /*
                Calculate how many words should
                approximately be hidden.
            */
        
            let targetBlankWords =
                Math.round(
                    totalWords *
                    currentPercentage /
                    100
                );
        
        
            /*
                Minimum blank size is 2 words.
            */
        
            if (
                totalWords >= 2 &&
                targetBlankWords < 2
            ) {
        
                targetBlankWords = 2;
        
            }
        
        
            /*
                Randomize possible starting positions.
            */
        
            const possibleStarts =
                shuffle(allWords);
        
        
            let blankWordsCreated = 0;
        
        
            /*
                Create random 2–6 word blanks.
            */
        
            for (
                const start of possibleStarts
            ) {
        
                if (
                    blankWordsCreated >=
                    targetBlankWords
                ) {
        
                    break;
        
                }
        
        
                const verseData =
                    verses.find(
                        v =>
                            v.verse ===
                            start.verse
                    );
        
        
                if (!verseData) {
                    continue;
                }
        
        
                const remainingWords =
                    verseData.words.length -
                    start.index;
        
        
                /*
                    A blank must contain
                    at least 2 words.
                */
        
                if (
                    remainingWords < 2
                ) {
        
                    continue;
        
                }
        
        
                /*
                    Don't overlap another blank.
                */
        
                let alreadyBlank = false;
        
        
                for (
                    let j = start.index;
        
                    j < verseData.words.length &&
                    j < start.index + 6;
        
                    j++
                ) {
        
                    if (
                        verseData.words[j].blank
                    ) {
        
                        alreadyBlank = true;
        
                        break;
        
                    }
        
                }
        
        
                if (alreadyBlank) {
                    continue;
                }
        
        
                /*
                    Determine maximum blank size.
                */
        
                let maxLength =
                    Math.min(
                        6,
                        remainingWords
                    );
        
        
                /*
                    Don't exceed the target.
                */
        
                maxLength =
                    Math.min(
                        maxLength,
                        targetBlankWords -
                        blankWordsCreated
                    );
        
        
                if (
                    maxLength < 2
                ) {
        
                    continue;
        
                }
        
        
                /*
                    Random blank size:
                    2–6 words.
                */
        
                let blankLength =
                    Math.floor(
                        Math.random() *
                        (maxLength - 1)
                    ) + 2;
        
        
                /*
                    If only two words remain
                    in the target, use exactly 2.
                */
        
                if (
                    targetBlankWords -
                    blankWordsCreated <= 2
                ) {
        
                    blankLength = 2;
        
                }
        
        
                /*
                    Mark words as blank.
                */
        
                for (
                    let j = start.index;
        
                    j <
                    start.index + blankLength;
        
                    j++
                ) {
        
                    verseData.words[j].blank =
                        true;
        
                }
        
        
                blankWordsCreated +=
                    blankLength;
        
            }
        
        
            return verses;
        
        }


        /* =========================================================
           RENDER QUIZ
        ========================================================= */

        function renderQuiz(verses) {

            const quizArea =
                document.getElementById(
                    "quizArea"
                );


            quizArea.innerHTML = "";


            const heading =
                document.createElement("h2");

            heading.className =
                "chapter-title";

            heading.textContent =
                `Revelation ${currentChapter}`;

            quizArea.appendChild(
                heading
            );


            verses.forEach(
                verseData => {

                    const verseElement =
                        document.createElement("div");

                    verseElement.className =
                        "verse";


                    const verseNumber =
                        document.createElement("span");

                    verseNumber.className =
                        "verse-number";

                    verseNumber.textContent =
                        `${verseData.verse}.`;

                    verseElement.appendChild(
                        verseNumber
                    );


                    let i = 0;


                    while (
                        i <
                        verseData.words.length
                    ) {

                        const word =
                            verseData.words[i];


                        /*
                            Visible word.
                        */

                        if (!word.blank) {

                            verseElement.appendChild(
                                document.createTextNode(
                                    word.text + " "
                                )
                            );

                            i++;

                            continue;

                        }


                        /*
                            Find the complete
                            consecutive blank.
                        */

                        const blankStartIndex =
                            i;


                        let blankWords = [];


                        while (
                            i <
                            verseData.words.length &&
                            verseData.words[i].blank
                        ) {

                            blankWords.push(
                                verseData.words[i].text
                            );

                            i++;

                        }


                        const correctPhrase =
                            blankWords.join(" ");


                        /*
                            Create input.
                        */

                        const input =
                            document.createElement(
                                "textarea"
                            );
                        
                        input.rows = 1;
                        
                        input.className =
                            "blank-input";
                        
                        input.addEventListener(
                            "input",
                            function () {
                        
                                this.style.height = "auto";
                        
                                this.style.height =
                                    this.scrollHeight + "px";
                        
                            }
                        );
                        
                        input.autocomplete =
                            "off";
                        
                        input.spellcheck =
                            false;


                        input.dataset.verse =
                            verseData.verse;


                        input.dataset.wordIndex =
                            blankStartIndex;


                        input.dataset.blankLength =
                            blankWords.length;


                        input.dataset.answer =
                            correctPhrase;


                        /*
                            Restore any existing
                            user answer.
                        */

                        input.value =
                            verseData.words[
                                blankStartIndex
                            ].userAnswer || "";


                        /*
                            Width based on answer.
                        */

                        const cleanPhrase =
                            correctPhrase.trim();


                        input.style.width =
                            Math.max(
                                180,
                                Math.min(
                                    500,
                                    cleanPhrase.length *
                                    10 +
                                    50
                                )
                            ) + "px";


                        /*
                            IMPORTANT:
                            Store the original
                            starting index.
                        */

                        input.addEventListener(
                            "input",
                            function () {

                                const answer =
                                    this.value;


                                verseData.words[
                                    blankStartIndex
                                ].userAnswer =
                                    answer;


                                if (!quizChecked) {

                                    this.classList.remove(
                                        "correct",
                                        "wrong",
                                        "unanswered"
                                    );

                                }

                            }
                        );


                        verseElement.appendChild(
                            input
                        );


                        /*
                            Add a space after
                            the input.
                        */

                        verseElement.appendChild(
                            document.createTextNode(
                                " "
                            )
                        );

                    }


                    quizArea.appendChild(
                        verseElement
                    );

                }
            );

        }


        /* =========================================================
           START QUIZ
        ========================================================= */

        function startQuiz() {

            currentChapter =
                Number(
                    document.getElementById(
                        "chapterSelect"
                    ).value
                );


            currentPercentage =
                Number(
                    document.getElementById(
                        "percentageSelect"
                    ).value
                );


            currentStartVerse =
                Number(
                    document.getElementById(
                        "startVerse"
                    ).value
                );


            currentEndVerse =
                Number(
                    document.getElementById(
                        "endVerse"
                    ).value
                );


            /*
                Validate verse range.
            */

            if (
                currentStartVerse < 1
            ) {

                currentStartVerse = 1;

            }


            if (
                currentEndVerse <
                currentStartVerse
            ) {

                alert(
                    "End verse must be greater than or equal to start verse."
                );

                return;

            }


            /*
                Get available verses.
            */

            const verses =
                getSelectedVerses();


            const warning =
                document.getElementById(
                    "dataWarning"
                );


            /*
                Warn if no verse data exists.
            */

            if (
                verses.length === 0
            ) {

                warning.classList.remove(
                    "hidden"
                );

                warning.innerHTML =
                    `
                    <strong>No verse data found.</strong><br>
                    Please paste your Bible text into
                    the <code>bibleData</code> section
                    of the JavaScript.
                    `;

                document.getElementById(
                    "quizArea"
                ).innerHTML = "";

                document.getElementById(
                    "result"
                ).classList.add(
                    "hidden"
                );

                document.getElementById(
                    "checkBtn"
                ).classList.add(
                    "hidden"
                );

                document.getElementById(
                    "retestBtn"
                ).classList.add(
                    "hidden"
                );

                document.getElementById(
                    "restartBtn"
                ).classList.add(
                    "hidden"
                );

                return;

            }


            warning.classList.add(
                "hidden"
            );


            /*
                Create fresh quiz.
            */

            quizChecked = false;


            const quizData =
                createQuiz(
                    verses
                );


            renderQuiz(
                quizData
            );


            /*
                Show buttons.
            */

            document.getElementById(
                "checkBtn"
            ).classList.remove(
                "hidden"
            );


            document.getElementById(
                "restartBtn"
            ).classList.remove(
                "hidden"
            );


            document.getElementById(
                "retestBtn"
            ).classList.add(
                "hidden"
            );


            document.getElementById(
                "result"
            ).classList.add(
                "hidden"
            );

        }


        /* =========================================================
           CHECK ANSWERS
        ========================================================= */

        function checkAnswers() {

            if (quizChecked) {
                return;
            }


            quizChecked = true;


            const inputs =
                document.querySelectorAll(
                    ".blank-input"
                );


            let correct = 0;

            let wrong = 0;

            let unanswered = 0;

            let total = inputs.length;


            inputs.forEach(
                input => {

                    const userAnswer =
                        input.value.trim();


                    const correctAnswer =
                        input.dataset.answer;


                    /*
                        Find the verse data.
                    */

                    const verseNumber =
                        Number(
                            input.dataset.verse
                        );


                    const wordIndex =
                        Number(
                            input.dataset.wordIndex
                        );


                    const chapterData =
                        bibleData[
                            currentChapter
                        ];


                    const verseData =
                        chapterData[
                            verseNumber
                        ];


                    /*
                        Empty answer.
                    */

                    if (
                        userAnswer === ""
                    ) {

                        input.classList.add(
                            "unanswered"
                        );

                        unanswered++;

                        /*
                            Mark the phrase wrong.
                        */

                        if (verseData) {

                            const words =
                                verseData
                                    .trim()
                                    .split(/\s+/);


                            const blankLength =
                                Number(
                                    input.dataset.blankLength
                                );


                            for (
                                let i = wordIndex;
                                i <
                                wordIndex +
                                blankLength;
                                i++
                            ) {

                                if (
                                    verseData
                                ) {
                                    // State is stored separately below.
                                }

                            }

                        }


                        /*
                            Show correct answer
                            for unanswered blank.
                        */

                        const answerDisplay =
                            document.createElement(
                                "span"
                            );


                        answerDisplay.className =
                            "correct-answer-display";


                        answerDisplay.dataset.forVerse =
                            verseNumber;


                        answerDisplay.dataset.forWord =
                            wordIndex;


                        answerDisplay.textContent =
                            correctAnswer;


                        input.insertAdjacentElement(
                            "afterend",
                            answerDisplay
                        );


                        /*
                            Add a real space.
                        */

                        answerDisplay.insertAdjacentText(
                            "afterend",
                            " "
                        );


                        return;

                    }


                    /*
                        Compare answer.
                    */

                    const isCorrect =
                        phraseIsEquivalent(
                            userAnswer,
                            correctAnswer
                        );


                    if (isCorrect) {

                        input.classList.add(
                            "correct"
                        );

                        correct++;

                    }

                    else {

                        input.classList.add(
                            "wrong"
                        );

                        wrong++;


                        /*
                            Show the correct answer.
                        */

                        const answerDisplay =
                            document.createElement(
                                "span"
                            );


                        answerDisplay.className =
                            "correct-answer-display";


                        answerDisplay.dataset.forVerse =
                            verseNumber;


                        answerDisplay.dataset.forWord =
                            wordIndex;


                        answerDisplay.textContent =
                            correctAnswer;


                        input.insertAdjacentElement(
                            "afterend",
                            answerDisplay
                        );


                        /*
                            Add a real space after
                            the displayed answer.
                        */

                        answerDisplay.insertAdjacentText(
                            "afterend",
                            " "
                        );

                    }


                    /*
                        Save state for retest.
                    */

                    if (verseData) {

                        const words =
                            verseData
                                .trim()
                                .split(/\s+/);


                        const blankLength =
                            Number(
                                input.dataset.blankLength
                            );


                        /*
                            Store result directly
                            in a temporary property.
                        */

                        if (!window.quizStates) {

                            window.quizStates = {};

                        }


                        if (
                            !window.quizStates[
                                currentChapter
                            ]
                        ) {

                            window.quizStates[
                                currentChapter
                            ] = {};

                        }


                        window.quizStates[
                            currentChapter
                        ][
                            `${verseNumber}-${wordIndex}`
                        ] = {

                            correct:
                                isCorrect,

                            answer:
                                userAnswer,

                            correctAnswer:
                                correctAnswer,

                            length:
                                blankLength

                        };

                    }


                    /*
                        Lock answer after checking.
                    */

                    input.readOnly = true;

                    input.classList.add(
                        "checked"
                    );

                }
            );


            /*
                Calculate score.

                Empty answers count as wrong.
            */

            const score =
                total > 0
                    ? Math.round(
                        correct /
                        total *
                        100
                    )
                    : 0;


            /*
                Show result.
            */

            const result =
                document.getElementById(
                    "result"
                );


            let resultClass =
                "success";


            if (
                score < 70
            ) {

                resultClass =
                    "failure";

            }


            result.classList.remove(
                "hidden"
            );


            result.innerHTML =
                `
                <h2>Quiz Result</h2>

                <div class="score ${resultClass}">
                    ${correct} / ${total}
                    (${score}%)
                </div>

                <div>
                    Correct: <strong>${correct}</strong>
                    &nbsp; | &nbsp;
                    Wrong: <strong>${wrong}</strong>
                    &nbsp; | &nbsp;
                    Unanswered: <strong>${unanswered}</strong>
                </div>
                `;


            /*
                Hide Check button.
            */

            document.getElementById(
                "checkBtn"
            ).classList.add(
                "hidden"
            );


            /*
                Show retest only if
                there are wrong answers.
            */

            if (
                wrong > 0 ||
                unanswered > 0
            ) {

                document.getElementById(
                    "retestBtn"
                ).classList.remove(
                    "hidden"
                );

            }

        }


        /* =========================================================
           RETEST WRONG ANSWERS
        ========================================================= */

        function retestWrongAnswers() {

            /*
                Find all currently displayed
                blank inputs.
            */

            const inputs =
                document.querySelectorAll(
                    ".blank-input"
                );


            const wrongBlanks = [];


            inputs.forEach(
                input => {

                    const isWrong =
                        input.classList.contains(
                            "wrong"
                        ) ||
                        input.classList.contains(
                            "unanswered"
                        );


                    if (!isWrong) {
                        return;
                    }


                    wrongBlanks.push({

                        verse:
                            Number(
                                input.dataset.verse
                            ),

                        wordIndex:
                            Number(
                                input.dataset.wordIndex
                            ),

                        length:
                            Number(
                                input.dataset.blankLength
                            )

                    });

                }
            );


            /*
                Nothing to retest.
            */

            if (
                wrongBlanks.length === 0
            ) {

                alert(
                    "There are no wrong answers to retest."
                );

                return;

            }


            /*
                Get original chapter data.
            */

            const chapter =
                bibleData[
                    currentChapter
                ];


            /*
                Reset all verse data.
            */

            const verses = [];


            for (
                let verse =
                    currentStartVerse;

                verse <= currentEndVerse;

                verse++
            ) {

                if (
                    chapter[verse] &&
                    chapter[verse].trim() !== ""
                ) {

                    const words =
                        chapter[verse]
                            .trim()
                            .split(/\s+/);


                    verses.push({

                        verse: verse,

                        words:
                            words.map(
                                word => ({
                                    text: word,
                                    blank: false,
                                    userAnswer: "",
                                    correct: null
                                })
                            )

                    });

                }

            }


            /*
                Reapply only wrong blanks.
            */

            wrongBlanks.forEach(
                blank => {

                    const verseData =
                        verses.find(
                            v =>
                                v.verse ===
                                blank.verse
                        );


                    if (!verseData) {
                        return;
                    }


                    for (
                        let i =
                            blank.wordIndex;

                        i <
                        blank.wordIndex +
                        blank.length;

                        i++
                    ) {

                        if (
                            verseData.words[i]
                        ) {

                            verseData.words[i].blank =
                                true;

                        }

                    }

                }
            );


            /*
                Convert verse objects back
                into renderable format.
            */

            quizChecked = false;


            /*
                Remove all previous
                correct-answer displays.
            */

            document
                .querySelectorAll(
                    ".correct-answer-display"
                )
                .forEach(
                    element =>
                        element.remove()
                );


            /*
                Render only the previous
                wrong blanks.
            */

            renderQuiz(
                verses
            );


            /*
                Change heading.
            */

            const heading =
                document.querySelector(
                    ".chapter-title"
                );


            if (heading) {

                heading.textContent =
                    `Revelation ${currentChapter} — Retest`;

            }


            /*
                Update buttons.
            */

            document.getElementById(
                "checkBtn"
            ).classList.remove(
                "hidden"
            );


            document.getElementById(
                "retestBtn"
            ).classList.add(
                "hidden"
            );


            document.getElementById(
                "result"
            ).classList.add(
                "hidden"
            );

        }


        /* =========================================================
           CHAPTER CHANGE
           
           Automatically adjust end verse
           when changing chapter.
        ========================================================= */

        document
            .getElementById(
                "chapterSelect"
            )
            .addEventListener(
                "change",
                function () {

                    const chapter =
                        Number(
                            this.value
                        );


                    const verseCount =
                        Object.keys(
                            bibleData[chapter] || {}
                        ).length;


                    document.getElementById(
                        "startVerse"
                    ).value = 1;


                    document.getElementById(
                        "endVerse"
                    ).value =
                        verseCount || 1;

                }
            );


        /* =========================================================
           INITIAL SETUP
        ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const chapter =
                    Number(
                        document.getElementById(
                            "chapterSelect"
                        ).value
                    );


                const verseCount =
                    Object.keys(
                        bibleData[chapter] || {}
                    ).length;


                document.getElementById(
                    "endVerse"
                ).value =
                    verseCount || 1;

            }
        );

    </script>
